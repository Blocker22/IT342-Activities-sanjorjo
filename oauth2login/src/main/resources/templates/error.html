<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Google Contacts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --google-gray: #5F6368;
            --google-border: #DADCE0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FFFFFF;
            color: var(--google-gray);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .error-icon {
            margin-bottom: 24px;
            color: var(--google-red);
        }

        .error-icon .material-icons {
            font-size: 64px;
        }

        .error-code {
            font-family: 'Google Sans', sans-serif;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #202124;
        }

        .error-title {
            font-family: 'Google Sans', sans-serif;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 24px;
            color: #202124;
        }

        .error-message {
            font-size: 16px;
            margin-bottom: 24px;
            color: var(--google-gray);
        }

        .error-details {
            background-color: #F8F9FA;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            margin-bottom: 32px;
            border: 1px solid var(--google-border);
        }

        .error-details p {
            margin: 8px 0;
            font-size: 14px;
        }

        .error-details strong {
            color: #202124;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Google Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background-color: var(--google-blue);
            padding: 10px 24px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .back-button:hover {
            background-color: #3367D6;
            box-shadow: 0 1px 2px rgba(66, 133, 244, 0.3);
        }

        .back-button .material-icons {
            margin-right: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <span class="material-icons">error_outline</span>
        </div>

        <h1 class="error-code" th:text="${status}">500</h1>
        <h2 class="error-title" th:text="${error}">Error</h2>

        <div class="error-message">
            <p th:text="${message}">Error message</p>
        </div>

        <div class="error-details">
            <p><strong>Path:</strong> <span th:text="${path}">Request path</span></p>
            <p><strong>Time:</strong> <span th:text="${timestamp}">Timestamp</span></p>
        </div>

        <a href="/googleuser" class="back-button">
            <span class="material-icons">home</span>
            Back to Home
        </a>
    </div>
</body>
</html>
